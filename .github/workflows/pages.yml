name: Deploy implicit game
on:
  push:
    branches: [main]
    paths:
      - 'implicit-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check game entry
        run: test -f implicit-site/index.html && test -f implicit-site/work.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: implicit-site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
